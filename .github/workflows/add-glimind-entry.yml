name: Add Glimind entry
on:
  push:
    paths:
      - '.github/workflows/add-glimind-entry.yml'
permissions:
  contents: write
jobs:
  add-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert Glimind entry at end of Monitoring section
        run: |
          python3 <<'PYEOF'
          p = 'README.md'
          with open(p, encoding='utf-8') as f:
              text = f.read()
          if '[Glimind](https://glimind.com)' in text:
              print('Entry already present, skipping')
              raise SystemExit(0)
          lines = text.split('\n')
          entry = '- [Glimind](https://glimind.com) \u2601\ufe0f - Live reliability, agent-readiness grades and tool-poisoning scans for every public MCP server; route_task picks a working tool for a task. Remote, no auth: https://glimind.com/mcp'
          idx = next(i for i, l in enumerate(lines) if l.startswith('###') and 'multimedia-process' in l)
          assert lines[idx-1] == '', 'expected blank line before Multimedia heading'
          lines.insert(idx-1, entry)
          with open(p, 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          print('Inserted entry before line %d' % (idx+1))
          PYEOF
      - name: Commit to new branch
        run: |
          git config user.name "shawndei"
          git config user.email "shawndei@users.noreply.github.com"
          git checkout -b add-glimind
          git add README.md
          git commit -m "Add Glimind to Monitoring section"
          git push origin add-glimind
