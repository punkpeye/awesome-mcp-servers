name: Add MartinLoop once
on:
  push:
    branches: [add-martinloop-mcp-current]
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-martinloop-mcp-current
      - name: Add MartinLoop entry and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          entry = '- [Keesan12/martin-loop](https://github.com/Keesan12/martin-loop) [![Keesan12/martin-loop MCP server](https://glama.ai/mcp/servers/Keesan12/martin-loop/badges/score.svg)](https://glama.ai/mcp/servers/Keesan12/martin-loop) 📇 🏠 - Governed MCP runtime for AI coding agents with budget caps, verifier gates, runaway-loop prevention, rollback evidence, and inspectable run receipts. Install: `npx -y @martinloop/mcp`.'
          if 'Keesan12/martin-loop' not in text:
              marker = '- [kagan-sh/kagan]'
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith(marker):
                      lines.insert(i + 1, entry)
                      break
              else:
                  raise SystemExit('Insertion marker not found')
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/add-martinloop-once.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/add-martinloop-once.yml
          git commit -m "docs: add MartinLoop MCP server"
          git push origin HEAD:add-martinloop-mcp-current