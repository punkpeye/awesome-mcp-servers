name: add-proof-inbox
on:
  workflow_dispatch:
  push:
    branches: [add-proof-inbox]
    paths:
      - '.github/workflows/add-proof-inbox.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-proof-inbox
      - name: Insert Proof Inbox listing
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          marker = 'timdoes/proof-inbox-mcp'
          if marker in text:
              print('already present')
          else:
              needle = '- [timkulbaev/mcp-gmail](https://github.com/timkulbaev/mcp-gmail)'
              insert = (
                  '- [timdoes/proof-inbox-mcp](https://github.com/timdoes/proof-inbox-mcp) '
                  '[![timdoes/proof-inbox-mcp MCP server](https://glama.ai/mcp/servers/timdoes/proof-inbox-mcp/badges/score.svg)]'
                  '(https://glama.ai/mcp/servers/timdoes/proof-inbox-mcp) '
                  '\\u2601\\ufe0f - Prepaid email-verify credits for MCP agents via Stripe Link.\n'
              )
              if needle not in text:
                  raise SystemExit('anchor not found')
              p.write_text(text.replace(needle, insert + needle, 1))
              print('inserted')
          PY
      - name: Commit listing
        run: |
          git config user.name "timdoes"
          git config user.email "3385628+timdoes@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo 'no README change'
          else
            git commit -m "Add Proof Inbox MCP server"
            git push
          fi
