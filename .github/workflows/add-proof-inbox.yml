name: add-proof-inbox
on:
  workflow_dispatch:
  push:
    branches: [add-proof-inbox]
    paths:
      - '.github/workflows/add-proof-inbox.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-proof-inbox
      - name: Normalize Proof Inbox listing
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          new_line = (
              '- [timdoes/proof-inbox-mcp](https://github.com/timdoes/proof-inbox-mcp) '
              '[![timdoes/proof-inbox-mcp MCP server](https://glama.ai/mcp/servers/timdoes/proof-inbox-mcp/badges/score.svg)]'
              '(https://glama.ai/mcp/servers/timdoes/proof-inbox-mcp) '
              '☁️ - Prepaid email-verify credits for MCP agents via Stripe Link.'
          )
          text2, n = re.subn(r'^- \[timdoes/proof-inbox-mcp\].*$', new_line, text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit(f'expected 1 listing, replaced {n}')
          p.write_text(text2)
          print('normalized')
          PY
      - name: Commit listing
        run: |
          git config user.name "timdoes"
          git config user.email "3385628+timdoes@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo 'no README change'
          else
            git commit -m "Normalize Proof Inbox listing"
            git push
          fi
