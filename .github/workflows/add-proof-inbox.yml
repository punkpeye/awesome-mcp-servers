name: add-proof-inbox
on:
  workflow_dispatch:
  push:
    branches: [add-proof-inbox]
    paths:
      - '.github/workflows/add-proof-inbox.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-proof-inbox
      - name: Fix Proof Inbox listing emoji
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          old = r'\u2601\ufe0f'
          new = '☁️'
          if old not in text:
              if 'timdoes/proof-inbox-mcp' in text and new in text:
                  print('already fixed')
              else:
                  raise SystemExit('expected listing not found')
          else:
              p.write_text(text.replace(old, new, 1))
              print('fixed emoji')
          PY
      - name: Commit listing
        run: |
          git config user.name "timdoes"
          git config user.email "3385628+timdoes@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo 'no README change'
          else
            git commit -m "Fix Proof Inbox listing emoji"
            git push
          fi
